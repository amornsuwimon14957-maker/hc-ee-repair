<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเข้าสู่ระบบช่างซ่อม</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
        }
        .form-group select, 
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background-color: #0056b3;
        }
        #error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>เข้าสู่ระบบผู้ซ่อม</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="technician">ชื่อผู้ซ่อม (ID)</label>
            <select id="technician" required>
                <option value="" disabled selected>-- เลือกชื่อผู้ซ่อม --</option>
                <option value="0308">อมร อมรกุล</option>
                <option value="0107">ปัญณวัฒน์ แสงนาค</option>
                <option value="0290">ชาติชาย หนิ้ววิยะวงค์</option>
                <option value="0398">สงกรานต์ ช่องสูงเนิน</option>
                <option value="0586">วิมลรัตน์ ยุทธรศาร</option>
                <option value="0626">ประมวลศักดิ์ ทูลฉลอง</option>
                <option value="0628">เอกพนธ์ พาซอและ</option>
                <option value="0749">รัชชานนท์ อาจอ</option>
                <option value="0267">อดิศักดิ์ สุขดี</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">รหัสผ่าน (รหัสพนักงาน)</label>
            <input type="password" id="password" placeholder="กรอกรหัสพนักงาน 4 หลัก" maxlength="4" required>
        </div>

        <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
        <div id="error-msg">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const selectedTech = document.getElementById('technician');
        const correctPassword = selectedTech.value;
        const inputPassword = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('error-msg');
        const selectedName = selectedTech.options[selectedTech.selectedIndex].text;

        if (inputPassword === correctPassword) {
            errorMsg.style.display = 'none';
            alert('เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับ คุณ' + selectedName);
            
            // บันทึกข้อมูลผู้ใช้งานไว้ใน Session
            sessionStorage.setItem('loggedInUser', selectedName);
            sessionStorage.setItem('empId', correctPassword);

            // เปลี่ยนหน้าไปยังระบบซ่อม (แก้ไข URL ตามหน้าหลักของคุณ)
            // window.location.href = 'dashboard.html';
        } else {
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
